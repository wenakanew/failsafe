name: Reliability Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv and deps
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false
    
    - run: uv sync
    
    - name: Test Flow
      run: |
        uv run pytest --cov=app --cov-fail-under=70
